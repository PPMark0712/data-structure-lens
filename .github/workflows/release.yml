name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot 4.7.2
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools
          mv .tools/Godot_v4.7.2-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          touch .tools/_sc_
      - uses: actions/cache@v4
        with:
          path: .tools/templates
          key: godot-4.7.2-release-templates
      - name: Validate algorithms and interactions
        run: python3 tools/project.py test
      - name: Build Web and desktop packages
        run: python3 tools/project.py package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/releases/DataStructureLab-Windows-x86_64.zip
            build/releases/DataStructureLab-macOS-universal.zip

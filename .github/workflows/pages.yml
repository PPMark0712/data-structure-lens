name: Validate and publish Web

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o .tools/godot.zip
          unzip -q .tools/godot.zip -d .tools
          mv .tools/Godot_v4.7.2-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          touch .tools/_sc_
      - uses: actions/cache@v4
        with:
          path: .tools/templates
          key: godot-4.7.2-web-templates
      - name: Validate algorithms and interactions
        run: python3 tools/project.py test
      - name: Export Web
        run: python3 tools/project.py export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
